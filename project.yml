name: BlastBlocks
options:
  bundleIdPrefix: com.blastblocks
  deploymentTarget:
    iOS: "15.0"
targets:
  BlastBlocks:
    type: application
    platform: iOS
    sources:
      - path: BlastBlocks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blastblocks.game
        PRODUCT_NAME: BlastBlocks
        INFOPLIST_FILE: BlastBlocks/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  BlastBlocks:
    build:
      targets:
        BlastBlocks: all
    run:
      config: Debug
    archive:
      config: Release
